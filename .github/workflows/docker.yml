name: Docker Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile.*'
      - 'cmd/nilpkg-server/**'
      - 'cmd/softbusd/**'
      - 'pkg/registry/**'
      - 'pkg/softbus/**'
  pull_request:
    branches: [ main, master ]

jobs:
  build-docker:
    name: Build Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build nilpkg-server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nilpkg-server
          push: false
          tags: nilang/nilpkg-server:latest

      - name: Build softbusd Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.softbusd
          push: false
          tags: nilang/softbusd:latest
