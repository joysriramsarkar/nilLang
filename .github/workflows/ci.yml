name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Nilang 0.1 core stabilization gate
        run: go test ./tests/... ./compiler/parser ./compiler/typecheck ./compiler/formatter ./cmd/nil ./cmd/nil-runner

      - name: Run unit tests
        run: go test -v -race ./...
        if: matrix.os != 'windows-latest'

      - name: Run unit tests (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

  build:
    name: Build & Verify Examples (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build all binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p bin
          go build -o bin/nil ./cmd/nil
          go build -o bin/nilc ./cmd/nilc
          go build -o bin/nil-bootstrap ./cmd/nil-bootstrap
          go build -o bin/nil-lsp ./cmd/nil-lsp
          go build -o bin/nil-runner ./cmd/nil-runner
          go build -o bin/nilpkg ./cmd/nilpkg
          go build -o bin/nilpkg-server ./cmd/nilpkg-server
          go build -o bin/nilkey ./cmd/nilkey
          go build -o bin/softbusd ./cmd/softbusd

      - name: Build all binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir bin -ErrorAction SilentlyContinue
          go build -o bin/nil.exe ./cmd/nil
          go build -o bin/nilc.exe ./cmd/nilc
          go build -o bin/nil-bootstrap.exe ./cmd/nil-bootstrap
          go build -o bin/nil-lsp.exe ./cmd/nil-lsp
          go build -o bin/nil-runner.exe ./cmd/nil-runner
          go build -o bin/nilpkg.exe ./cmd/nilpkg
          go build -o bin/nilpkg-server.exe ./cmd/nilpkg-server
          go build -o bin/nilkey.exe ./cmd/nilkey
          go build -o bin/softbusd.exe ./cmd/softbusd

      - name: Verify CLI version (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./bin/nil version

      - name: Verify CLI version (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\bin\nil.exe version

      - name: Test Running Hello Onuron (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./bin/nil run examples/hello-onuron/src/main.nil

      - name: Test Running Hello Onuron (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\bin\nil.exe run examples/hello-onuron/src/main.nil

      - name: Test Declarative UI Render (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./bin/nil render

      - name: Test Declarative UI Render (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\bin\nil.exe render

  postgres-integration:
    name: PostgreSQL Integration Tests
    needs: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nilang_test
          POSTGRES_USER: nilang
          POSTGRES_PASSWORD: nilang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run PostgreSQL integration tests
        run: |
          go test -v -tags integration -count=1 -race ./pkg/alap/data/...
        env:
          TEST_POSTGRES_DSN: postgres://nilang:nilang_test@localhost:5432/nilang_test?sslmode=disable

  # P0.8 gate: conformance on every OS, with the machine-readable matrix kept
  # as an artifact. This is the published NilLang 0.1 conformance evidence.
  conformance:
    name: Conformance Matrix (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run conformance suites (no cache)
        run: go test -count=1 ./tests/...

      - name: Record conformance matrix
        run: go test -count=1 -json ./tests/... > conformance-matrix.json

      - name: Upload conformance matrix
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix-${{ matrix.os }}
          path: conformance-matrix.json
          retention-days: 90

  # P0.8 gate: formatter check, short fuzz smoke, and CLI rejection smoke.
  # The fuzz seed corpus already runs inside `go test ./...` on every OS;
  # this job additionally fuzzes each target briefly to catch instant
  # crashers (a `struct A{`-class input must never panic the toolchain).
  dx-gate:
    name: DX Gate (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build nil CLI (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p bin
          go build -o bin/nil ./cmd/nil
          go build -o bin/nilc ./cmd/nilc

      - name: Build nil CLI (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" }
          go build -o bin/nil.exe ./cmd/nil
          go build -o bin/nilc.exe ./cmd/nilc

      - name: Formatter check (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./bin/nil fmt --check examples
          ./bin/nil fmt --check std
          ./bin/nil fmt --check bootstrap

      - name: Formatter check (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\bin\nil.exe fmt --check examples
          .\bin\nil.exe fmt --check std
          .\bin\nil.exe fmt --check bootstrap

      - name: CLI rejection smoke (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          printf 'let x = 40; x + 2;' > /tmp/ok.nil
          printf 'let x = (1 + 2;' > /tmp/bad.nil
          ./bin/nilc /tmp/ok.nil
          if ./bin/nilc /tmp/bad.nil; then
            echo "expected nilc to reject bad.nil"
            exit 1
          fi

      - name: CLI rejection smoke (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          [IO.File]::WriteAllText("$env:TEMP\ok.nil", "let x = 40; x + 2;")
          [IO.File]::WriteAllText("$env:TEMP\bad.nil", "let x = (1 + 2;")
          .\bin\nilc.exe "$env:TEMP\ok.nil"
          $ok = $LASTEXITCODE
          .\bin\nilc.exe "$env:TEMP\bad.nil" | Out-Null
          if ($LASTEXITCODE -eq 0 -or $ok -ne 0) {
            Write-Error "rejection smoke failed (ok=$ok, bad=$LASTEXITCODE)"
            exit 1
          }

  # P0.8 gate: short fuzz smoke on Ubuntu. The seed corpus runs on every OS
  # inside the unit tests; this job spends a minute per target shaking out
  # instant crashers beyond the seeds.
  fuzz-smoke:
    name: Fuzz Smoke (Ubuntu)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Fuzz parser, lexer, formatter, frontend
        run: |
          go test -run XXX -fuzz FuzzParser -fuzztime 60s ./compiler/parser/
          go test -run XXX -fuzz FuzzTypeChecker -fuzztime 60s ./compiler/typecheck/
          go test -run XXX -fuzz FuzzLexer -fuzztime 60s ./compiler/lexer/
          go test -run XXX -fuzz FuzzFormat -fuzztime 60s ./compiler/formatter/
          go test -run XXX -fuzz FuzzCheck -fuzztime 60s ./compiler/frontend/

      - name: Fuzz pipeline and bytecode decode
        run: |
          go test -run XXX -fuzz FuzzPipelineCompile -fuzztime 60s ./pkg/compiler/
          go test -run XXX -fuzz FuzzDecodeBytecode -fuzztime 60s ./pkg/compiler/
