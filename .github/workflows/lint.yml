name: Lint & Format

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Check Formatting (gofmt)
        run: |
          DIFF=$(gofmt -s -l .)
          if [ -n "$DIFF" ]; then
            echo "❌ The following files need formatting with 'gofmt -s -w':"
            echo "$DIFF"
            exit 1
          fi
          echo "✅ All Go source files are formatted cleanly!"

      - name: Run Go Vet
        run: go vet ./...
